/* Compact drum editor: fit sixteen lanes before resorting to vertical scroll. */
.pattern-mode .source-panel{padding:6px 10px}
.pattern-mode .source-wave-wrap{height:76px}
.pattern-mode .panel-head{margin-bottom:5px;gap:8px}
.pattern-mode .source-footer{margin-top:5px;gap:4px}
.pattern-mode .source-footer button{padding:4px 7px;font-size:10px}
.pattern-mode .arrange{padding:6px}
.pattern-mode .pattern-toolbar{padding:6px 9px;gap:8px;flex-wrap:wrap}
.pattern-mode .pattern-toolbar small{display:none}
.pattern-mode .pattern-actions{gap:4px;flex-shrink:1}
.pattern-mode .pattern-actions button,.pattern-mode .pattern-actions select{padding:4px 6px;font-size:10px}
.pattern-mode .pattern-footer{padding:4px 9px;font-size:9px}
.pattern-mode .clip-scroll{padding:0;--slice-row-height:26px}
.pattern-mode .clip-label,.pattern-mode .clip-lane{height:var(--slice-row-height);box-sizing:border-box}
.pattern-mode .clip-label button{padding:1px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.pattern-mode .clip-label strong{font-size:10px;white-space:nowrap}
.pattern-mode .clip-label small{font-size:8px}
.pattern-mode .clip-event{top:2px;height:calc(var(--slice-row-height) - 4px);font-size:10px;border-radius:2px}
.pattern-mode .clip-resize{top:1px;bottom:1px}

/* Chopper bench tokens: approved specialist design, native offline type fallback. */
.ch-workspace {
  --ch-canvas: #14212b;
  --ch-surface: #1b2c39;
  --ch-line: #2b3e4c;
  --ch-ink: #f2f5fa;
  --ch-focus: #c4b2ff;
  --ch-pending: #f0aa53;
  --ch-muted: #b5c6d3;
  --ch-waveform: #a7cedd;
  display: grid;
  grid-template-columns: 216px minmax(0, 1fr) 250px;
  grid-template-rows: auto 1fr auto;
  min-height: 100dvh;
  background: var(--ch-canvas);
  color: var(--ch-ink);
  font:
    14px/1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color-scheme: dark;
}
.ch-workspace[hidden] {
  display: none;
}
.ch-workspace * {
  box-sizing: border-box;
}
.ch-workspace h1,
.ch-workspace h2,
.ch-workspace p {
  margin: 0;
}
.ch-workspace h1 {
  font-size: 22px;
  font-weight: 650;
  line-height: 1.15;
}
.ch-workspace h1 small {
  display: block;
  font-size: 11px;
  color: var(--ch-muted);
  font-weight: 400;
}
.ch-workspace h2 {
  font-size: 16px;
  font-weight: 600;
}
.ch-workspace button,
.ch-workspace input,
.ch-workspace select,
.ch-return {
  font: inherit;
  border: 1px solid var(--ch-line, #2b3e4c);
  border-radius: 4px;
  background: var(--ch-surface, #1b2c39);
  color: var(--ch-ink, #f2f5fa);
  min-height: 36px;
  padding: 6px 10px;
}
.ch-workspace button {
  cursor: pointer;
}
.ch-workspace button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.ch-workspace button[aria-pressed="true"],
.ch-workspace button.selected {
  border-color: var(--ch-focus);
  box-shadow: inset 0 0 0 1px var(--ch-focus);
}
.ch-workspace :focus-visible {
  outline: 2px solid var(--ch-focus);
  outline-offset: 3px;
}
.ch-workspace input[type="number"] {
  width: 82px;
  font-variant-numeric: tabular-nums;
}
.ch-workspace input[type="range"] {
  width: 88px;
  accent-color: var(--ch-focus);
  padding: 0;
}
.ch-workspace input[type="checkbox"] {
  width: 18px;
  min-height: 18px;
  accent-color: var(--ch-focus);
}
.ch-workspace label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ch-transport {
  grid-column: 1/-1;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--ch-line);
  position: sticky;
  top: 0;
  background: var(--ch-canvas);
  z-index: 14;
}
.ch-transport h1 {
  margin-right: auto;
}
.ch-transport .ch-play {
  background: var(--ch-focus);
  color: #14212b;
  min-width: 72px;
  font-weight: 650;
}
.ch-library {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  border-right: 1px solid var(--ch-line);
}
.ch-library > * {
  flex-shrink: 0;
}
.ch-library h2:not(:first-child) {
  margin-top: 20px;
}
.ch-library button {
  text-align: left;
  overflow-wrap: anywhere;
}
.ch-library small {
  display: block;
  color: var(--ch-muted);
}
.ch-library p,
.ch-inspector p {
  font-size: 12px;
  color: var(--ch-muted);
}
.ch-library-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 4px;
}
.ch-library details {
  margin-top: 16px;
}
.ch-library details button {
  width: 100%;
  margin-top: 8px;
}
.ch-center {
  grid-column: 2;
  grid-row: 2;
  min-width: 0;
  padding: 20px 0;
}
.ch-inspector {
  grid-column: 3;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 20px 16px;
  border-left: 1px solid var(--ch-line);
}
.ch-inspector label {
  justify-content: space-between;
}
.ch-segment {
  display: flex;
}
.ch-segment button {
  flex: 1;
}
.ch-edit-actions {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.ch-region-title {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px 12px;
  flex-wrap: wrap;
}
.ch-region-title span {
  font-size: 12px;
  color: var(--ch-muted);
}
.ch-region-title label {
  margin-left: auto;
  font-size: 12px;
}
.ch-wave-scroll,
.ch-pattern-scroll {
  overflow-x: auto;
  overscroll-behavior-x: contain;
  touch-action: pan-x pan-y;
}
.ch-wave {
  height: 230px;
  position: relative;
  background: #1b2c39;
}
.ch-wave canvas {
  display: block;
  width: 100%;
  height: 210px;
  pointer-events: none;
}
.ch-cues {
  position: absolute;
  inset: 0;
  display: flex;
}
.ch-cues button {
  flex: 1;
  min-width: 0;
  border-radius: 0;
  border-width: 0 1px 0 0;
  border-color: #2b3e4c80;
  background: transparent;

}
@media (max-width: 767px) {
  .ch-legacy {
    margin: 0 12px 12px;
    padding: 10px;
  }
  .ch-legacy-controls {
    align-items: stretch;
  }
  .ch-legacy-controls label {
    width: 100%;
  }
  .ch-legacy-fields {
    grid-template-columns: 1fr;
  }
  .ch-legacy > label {
    flex-wrap: wrap;
  }
  .ch-legacy-source strong {
    overflow-wrap: anywhere;
  }
}
@media (prefers-reduced-motion: reduce) {
  .ch-workspace * {
    scroll-behavior: auto;
  }
}


/* Product polish: clearer hierarchy, mobile controls, and no floating inspector. */
.ch-wave,
.ch-source-overview {
  background: var(--ch-surface);
}
.ch-region-title h2 {
  font-size: 18px;
}
.ch-region-title span,
.ch-region-title label,
.ch-context,
.ch-hint,
.ch-pattern-controls label,
.ch-ruler span,
.ch-base,
.ch-clocks,
.ch-inspector label,
.ch-inspector-body label,
.ch-boundary {
  font-size: 14px;
}
.ch-ruler span,
.ch-cues button span {
  font-size: 13px;
  color: var(--ch-muted);
}
.ch-library p,
.ch-inspector p {
  font-size: 14px;
  line-height: 1.45;
}
.ch-event strong {
  font-size: 16px;
}
.ch-event small {
  font-size: 12px;
}
.ch-transport .ch-operation-feedback {
  font-size: 14px;
}
.ch-library > button[title*="REL/ABS cannot be encoded"] + p {
  display: block;
  margin-top: 4px;
  padding: 12px;
  border: 1px solid var(--ch-pending);
  border-left: 4px solid var(--ch-pending);
  border-radius: 4px;
  background: #f0aa5318;
  color: var(--ch-ink);
  font-size: 14px;
  line-height: 1.45;
}
.ch-library > button[title*="REL/ABS cannot be encoded"] + p::before {
  content: "Studio preview only";
  display: block;
  margin-bottom: 5px;
  color: var(--ch-pending);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
@media (max-width: 1199px) {
  .ch-workspace {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto auto auto;
    padding-bottom: 0;
  }
  .ch-center {
    grid-column: 1;
    grid-row: 2;
  }
  .ch-event-dock,
  .ch-inspector {
    grid-column: 1;
    grid-row: 3;
    position: static;
    inset: auto;
    max-height: none;
    overflow: visible;
    z-index: auto;
    box-shadow: none;
    margin: 0 16px 16px;
  }
  .ch-event-dock {
    justify-self: stretch;
    width: auto;
  }
  .ch-inspector {
    flex-direction: column;
    align-items: stretch;
    flex-wrap: nowrap;
    border-left: 0;
    border-top: 2px solid var(--ch-focus);
    background: var(--ch-surface);
  }
  .ch-inspector-head {
    position: static;
  }
  .ch-inspector-body {
    overflow: visible;
    padding-bottom: 12px;
  }
  .ch-workspace.inspector-open {
    padding-bottom: 0;
  }
}
@media (max-width: 767px) {
  .ch-workspace {
    font-size: 14px;
  }
  .ch-transport {
    display: grid;
    grid-template-columns:
      minmax(88px, 1.15fr)
      minmax(88px, 1.15fr)
      minmax(60px, 0.8fr)
      minmax(84px, 1.1fr);
    grid-template-areas:
      "edit listen play bpm"
      "undo library project more"
      "feedback feedback feedback feedback";
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
  }
  .ch-transport h1 {
    grid-area: title;
  }
  .ch-transport > label.ch-secondary:has(select[aria-label="Edit slot"]) {
    grid-area: edit;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(36px, auto);
    gap: 4px;
    font-size: 14px;
  }
  .ch-transport > label.ch-secondary:has(select[aria-label="Listen mode"]) {
    grid-area: listen;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(36px, auto);
    gap: 4px;
    font-size: 14px;
  }
  .ch-transport .ch-play {
    grid-area: play;
    min-width: 0;
    width: 100%;
  }
  .ch-transport > label:has(input[aria-label="Transport BPM"]) {
    grid-area: bpm;
    gap: 4px;
    font-size: 14px;
    white-space: nowrap;
  }
  .ch-transport > button.ch-secondary:nth-of-type(3) {
    grid-area: undo;
    display: inline-flex;
  }
  .ch-transport .ch-library-toggle {
    grid-area: library;
  }
  .ch-transport .ch-project-menu {
    grid-area: project;
    justify-self: stretch;
  }
  .ch-transport .ch-more {
    grid-area: more;
    display: block;
  }
  .ch-transport .ch-operation-feedback {
    grid-area: feedback;
    line-height: 1.35;
  }
  .ch-transport select[aria-label="Edit slot"],
  .ch-transport select[aria-label="Listen mode"] {
    min-width: 36px;
    width: 42px;
    padding: 6px 4px;
  }
  .ch-transport input[aria-label="Transport BPM"] {
    width: 52px;
    padding: 6px 4px;
  }
  .ch-transport button,
  .ch-transport select,
  .ch-transport input {
    min-height: 44px;
  }
  .ch-transport button {
    padding: 6px 8px;
  }
  .ch-transport .ch-more,
  .ch-project-menu > summary {
    font-size: 14px;
  }
  .ch-project-menu > summary {
    min-height: 44px;
    padding: 10px 6px;
  }
  .ch-transport:not(.more-open) > label.ch-secondary:has(select[aria-label="Edit slot"]),
  .ch-transport:not(.more-open) > label.ch-secondary:has(select[aria-label="Listen mode"]) {
    display: grid;
  }
  .ch-transport:not(.more-open) > button.ch-secondary:nth-of-type(3) {
    display: inline-flex;
  }
  .ch-inspector,
  .ch-event-dock {
    margin: 0 12px 12px;
  }
  .ch-inspector-body {
    overflow: visible;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .ch-inspector label {
    font-size: 14px;
  }
  .ch-inspector-body label {
    font-size: 14px;
  }
  .ch-inspector > button {
    min-height: 44px;
  }
  .ch-event-dock {
    position: static;
    min-height: 44px;
    width: calc(100% - 24px);
  }
  .ch-workspace.inspector-open {
    padding-bottom: 0;
  }
}
@media (max-width: 359px) {
  .ch-transport {
    grid-template-columns:
      minmax(80px, 1.15fr)
      minmax(80px, 1.15fr)
      minmax(64px, 0.9fr);
    grid-template-areas:
      "edit listen play"
      "bpm undo library"
      "project more more"
      "feedback feedback feedback";
  }
  .ch-inspector-body {
    grid-template-columns: minmax(0, 1fr);
  }
}


/* Loop identity: keep A/B legible across the source and pattern workflow. */
.ch-loop-overview {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 12px 20px 4px;
}
.ch-loop-card {
  --loop-accent: #a7cedd;
  display: grid;
  gap: 3px;
  min-width: 0;
  padding: 10px 12px;
  border: 1px solid color-mix(in srgb, var(--loop-accent) 55%, #2b3e4c);
  border-left: 4px solid var(--loop-accent);
  border-radius: 7px;
  background: #1b2c39;
  color: var(--ch-ink);
  text-align: left;
}
.ch-loop-card[data-slot="1"] {
  --loop-accent: #e4a46a;
}
.ch-loop-card[aria-pressed="true"] {
  background: color-mix(in srgb, var(--loop-accent) 14%, #1b2c39);
  box-shadow: inset 0 0 0 1px var(--loop-accent);
}
.ch-loop-card-title {
  color: var(--loop-accent);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.ch-loop-card strong,
.ch-loop-card > span:not(.ch-loop-card-title),
.ch-loop-card small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ch-loop-card small {
  color: var(--ch-muted);
}
.ch-loop-overview > p {
  grid-column: 1 / -1;
  color: var(--ch-muted);
  font-size: 11px;
}
.ch-pattern[data-slot="0"] {
  --ch-pattern-accent: #a7cedd;
}
.ch-pattern[data-slot="1"] {
  --ch-pattern-accent: #e4a46a;
}
.ch-pattern[data-slot] .ch-event {
  border-color: color-mix(in srgb, var(--ch-pattern-accent) 82%, #2b3e4c);
  background: color-mix(in srgb, var(--ch-pattern-accent) 19%, #2b3e4c);
}
.ch-pattern[data-slot] .ch-event[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--ch-pattern-accent);
}
.ch-pattern[data-slot="1"] .ch-ruler span:first-child {
  color: #e4a46a;
}
@media (max-width: 560px) {
  .ch-loop-overview {
    padding: 10px 12px 4px;
    gap: 6px;
  }
  .ch-loop-card {
    padding: 8px;
    font-size: 12px;
  }
}


/* Independent analysis layers and per-loop preview effects. */
.ch-analysis {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}
.ch-marker-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
}
.ch-marker-controls > label,
.ch-marker-toggle {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.ch-marker-controls small {
  flex-basis: 100%;
  color: var(--ch-muted);
}
.ch-marker-toggle[data-kind="kick"] { color: #ef7979; }
.ch-marker-toggle[data-kind="snare"] { color: #e8b16d; }
.ch-marker-toggle[data-kind="hat"] { color: #76c9ad; }
.ch-marker-toggle[data-kind="other"] { color: #b6a0ea; }
.ch-drum-marker {
  position: absolute;
  z-index: 5;
  top: 0;
  bottom: 0;
  width: 0;
  min-width: 0;
  padding: 0;
  border: 0;
  background: transparent;
  overflow: visible;
  cursor: pointer;
}
.ch-drum-marker::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 18px;
  left: -1px;
  border-left: 2px solid var(--marker-color, #b6a0ea);
  opacity: .85;
}
.ch-drum-marker span {
  position: absolute;
  bottom: 0;
  left: 3px;
  min-width: 16px;
  height: 16px;
  padding: 0 3px;
  border-radius: 4px;
  background: #10202b;
  color: var(--marker-color, #b6a0ea);
  font-size: 10px;
  line-height: 16px;
  font-weight: 700;
}
.ch-drum-marker[data-kind="kick"] { --marker-color: #ef7979; }
.ch-drum-marker[data-kind="snare"] { --marker-color: #e8b16d; }
.ch-drum-marker[data-kind="hat"] { --marker-color: #76c9ad; }
.ch-drum-marker[data-kind="other"] { --marker-color: #b6a0ea; }
.ch-loop-effects {
  --loop-accent: #a7cedd;
  margin: 0 20px 12px;
  border: 1px solid color-mix(in srgb, var(--loop-accent) 48%, #2b3e4c);
  border-left: 4px solid var(--loop-accent);
  border-radius: 7px;
  background: #172833;
  color: var(--ch-ink);
}
.ch-loop-effects[data-slot="1"] { --loop-accent: #e4a46a; }
.ch-loop-effects > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 42px;
  padding: 8px 12px;
  cursor: pointer;
  list-style-position: inside;
}
.ch-loop-effects > summary strong { color: var(--loop-accent); }
.ch-loop-effects > summary span { color: var(--ch-muted); }
.ch-loop-effects > summary small { margin-left: auto; color: var(--ch-muted); }
.ch-loop-effects > p {
  margin: 0;
  padding: 0 12px 10px;
  color: var(--ch-muted);
  font-size: 12px;
}
.ch-fx-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(150px, 1fr));
  gap: 8px;
  padding: 0 12px 12px;
}
.ch-fx-grid fieldset {
  display: grid;
  align-content: start;
  gap: 8px;
  min-width: 0;
  padding: 8px;
  border: 1px solid #344958;
  border-radius: 6px;
}
.ch-fx-grid legend { color: var(--loop-accent); font-weight: 700; }
.ch-fx-grid label { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 5px; font-size: 12px; }
.ch-fx-grid label:has(input[type="checkbox"]) { display: flex; }
.ch-fx-grid output { color: var(--ch-muted); font-variant-numeric: tabular-nums; }
.ch-fx-grid input[type="range"] { grid-column: 1 / -1; width: 100%; min-width: 0; }
.ch-fx-grid input:disabled { opacity: .45; }
@media (max-width: 1050px) {
  .ch-fx-grid { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
}
@media (max-width: 640px) {
  .ch-loop-effects { margin: 0 12px 10px; }
  .ch-loop-effects > summary { flex-wrap: wrap; gap: 4px 8px; }
  .ch-loop-effects > summary small { margin-left: 0; }
  .ch-fx-grid { grid-template-columns: minmax(0, 1fr); }
  .ch-analysis { align-items: flex-start; }
}
