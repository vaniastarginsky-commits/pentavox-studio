/* Compact drum editor: fit sixteen lanes before resorting to vertical scroll. */
.pattern-mode .source-panel{padding:6px 10px}
.pattern-mode .source-wave-wrap{height:76px}
.pattern-mode .panel-head{margin-bottom:5px;gap:8px}
.pattern-mode .source-footer{margin-top:5px;gap:4px}
.pattern-mode .source-footer button{padding:4px 7px;font-size:10px}
.pattern-mode .arrange{padding:6px}
.pattern-mode .pattern-toolbar{padding:6px 9px;gap:8px;flex-wrap:wrap}
.pattern-mode .pattern-toolbar small{display:none}
.pattern-mode .pattern-actions{gap:4px;flex-shrink:1}
.pattern-mode .pattern-actions button,.pattern-mode .pattern-actions select{padding:4px 6px;font-size:10px}
.pattern-mode .pattern-footer{padding:4px 9px;font-size:9px}
.pattern-mode .clip-scroll{padding:0;--slice-row-height:26px}
.pattern-mode .clip-label,.pattern-mode .clip-lane{height:var(--slice-row-height);box-sizing:border-box}
.pattern-mode .clip-label button{padding:1px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.pattern-mode .clip-label strong{font-size:10px;white-space:nowrap}
.pattern-mode .clip-label small{font-size:8px}
.pattern-mode .clip-event{top:2px;height:calc(var(--slice-row-height) - 4px);font-size:10px;border-radius:2px}
.pattern-mode .clip-resize{top:1px;bottom:1px}

/* Unified modes share the source rail and source waveform, never a second import queue. */
:root{--accent:var(--teal);--accent-soft:color-mix(in srgb,var(--accent) 18%,transparent);--focus:var(--accent)}
.app{color:var(--text)}
.app :is(button,input,select,summary,[role=button]):focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app :is(button,input,select){font-variant-numeric:tabular-nums}
.app button:not(:disabled){transition:background-color .14s ease,border-color .14s ease}
.app .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,var(--text))}
.samples-views{gap:4px;padding:7px 12px;background:#111923}
.samples-views button{border-color:transparent;background:transparent;border-radius:6px;padding:8px 11px;color:#bbcbd6}
.samples-views button[aria-current="page"]{background:#302b45;border-color:#8269b8;color:#f1eaff;box-shadow:inset 0 -2px #b59bff}
.samples-views button small{font-size:10.5px;font-weight:450;color:#9eafbb}
.samples-views button{font-size:12px;min-height:40px}
.samples-views button[aria-current="page"] small{color:#d2c4f5}
.sidebar{background:#151f29}
.side-section{padding:14px 12px;border-color:#303d4b}
.source-entry{border-radius:8px}
.source-entry.selected{background:#263744;border-color:#718697;box-shadow:inset 3px 0 #ad8afb}
.source-entry .entry-main:focus-visible{outline-offset:-3px}
.source-panel{background:#192530}
.source-wave-wrap{border-color:#405466;background:#0d1822}
.workspace-mode-heading h2,.delivery-choices h3{text-wrap:balance}
.delivery-choices article{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.delivery-choices article p{flex:1;margin:4px 0 8px}
.delivery-choices button{margin-top:8px}
@media(prefers-reduced-motion:reduce){.app button:not(:disabled){transition:none}}
.samples-views .inspector-toggle{margin-left:0}
.samples-views .rail-toggle{margin-left:auto}
.sidebar.collapsed{display:none}
.samples-views>span{margin-left:0}
.workspace-mode-heading{padding:12px 0}
.workspace-mode-heading h2{margin:0 0 8px;font-size:19px}
.workspace-mode-heading p{max-width:850px;font-size:12px;line-height:1.6;color:var(--muted)}
.break-mode .arrange,.device-mode .arrange,.break-mode .inspector,.device-mode .inspector{display:none}
.break-mode .source-panel,.device-mode .source-panel{flex:1;overflow:auto;padding:18px 24px}
.break-mode .source-wave-wrap,.device-mode .source-wave-wrap{height:110px}
.break-mode .native-break-editor{margin:0}
.break-mode .native-break-editor summary{font-size:14px;padding:12px}
.delivery-choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seed-sequence-tester{grid-column:1/-1;padding:18px;border:1px solid var(--border);border-radius:10px;background:#14212c;min-width:0}
.seed-sequence-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.seed-sequence-head h3{margin:5px 0 0;font-size:17px}
.seed-sequence-badge{padding:4px 8px;border:1px solid #48677a;border-radius:99px;color:#b7d8e7;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.seed-sequence-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.seed-sequence-actions button{min-height:38px}
.seed-sequence-playback{padding:8px 10px;border-left:3px solid var(--teal);background:#1a3037;color:#c7ece8;font-size:11px;line-height:1.5}
.seed-sequence-controls{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:14px 0}
.seed-sequence-controls>label{display:flex;align-items:center;gap:9px;color:#c4d4df;font-size:12px;font-weight:700}
.seed-sequence-controls input[type=number]{width:74px}
.seed-sequence-controls .seed-probability{flex:1;min-width:min(100%,330px)}
.seed-probability input{flex:1;min-width:140px}
.seed-probability output{min-width:48px;text-align:right;color:#e9d5a8;font-variant-numeric:tabular-nums}
.seed-sequence-rules{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0;color:#a9bdca;font-size:10px}
.seed-sequence-rules span{padding:5px 8px;border:1px solid #34495a;border-radius:6px;background:#1b2a36}
.seed-sequence-summary{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0;color:#a9bdca;font-size:11px}
.seed-sequence-summary strong{color:#e3f2f3}
.seed-sequence-table-wrap{max-height:390px;overflow:auto;border:1px solid #344757;border-radius:8px;scrollbar-color:#47586b #17202a}
.seed-sequence-table{width:100%;border-collapse:collapse;font-size:11px;text-align:left}
.seed-sequence-table th,.seed-sequence-table td{padding:8px 10px;border-bottom:1px solid #2d3d4c;vertical-align:middle}
.seed-sequence-table thead{position:sticky;top:0;z-index:1;background:#22313d;color:#b8cad5}
.seed-sequence-table tbody th{width:70px;color:#e3edf1;font-variant-numeric:tabular-nums}
.seed-sequence-table tbody th small{display:block;margin-top:3px;color:#e8c986;font-size:8px;font-weight:600;white-space:nowrap}
.seed-sequence-table .is-filtered{color:#8295a4;background:#111b24}
.seed-sequence-table .is-active{background:#182b34}
.seed-sequence-table td:nth-child(3){min-width:145px}
.seed-kind{display:inline-block;min-width:62px;margin-right:7px;padding:3px 5px;border-radius:4px;background:#273849;color:#bbd2dc;font-size:8px;text-align:center;text-transform:uppercase;letter-spacing:.04em}
.seed-base{background:#24504b;color:#a4e3d4}.seed-variation{background:#3c3558;color:#d5c4ff}.seed-fill{background:#5a3d31;color:#ffd0ad}
.seed-fill-candidate,.seed-fill-draw,.seed-early-candidate,.seed-early-draw{display:block;margin-top:4px;font-size:9px;line-height:1.4}
.seed-fill-candidate,.seed-fill-draw{color:#ffd0ad}.seed-early-candidate,.seed-early-draw{color:#e5c57f}
.seed-sequence-message,.seed-sequence-warning{padding:10px;border-left:3px solid #eaba80;background:#30291f;color:#f0d6ad;font-size:11px;line-height:1.5}
.seed-sequence-footnote{margin:9px 0 0;color:var(--muted);font-size:10px;line-height:1.55}
.delivery-choices article,.delivery-boundary{padding:18px;border:1px solid var(--border);border-radius:10px;background:#14212c}
.delivery-choices h3{font-size:16px;margin:0 0 10px}
.delivery-choices p,.delivery-boundary p{font-size:12px;line-height:1.65;color:var(--muted)}
.delivery-choices button{display:block;margin-top:12px}
.delivery-boundary{margin-top:18px;border-left:3px solid var(--orange)}
.delivery-boundary strong{color:var(--orange);font-size:13px}
.pattern-mode .inspector.open{display:block;width:245px;flex-basis:245px}
.pattern-mode .inspector.open .field{margin:9px 0}
@media(max-width:1000px){.samples-views>span{display:none}.delivery-choices{grid-template-columns:1fr}}
@media(max-width:560px){.seed-sequence-head{align-items:flex-start;flex-direction:column}.seed-sequence-actions{justify-content:flex-start}.seed-sequence-controls{gap:12px}.seed-sequence-table th,.seed-sequence-table td{padding:7px 6px;font-size:10px}}
@media(max-width:850px){.samples-views .rail-toggle{margin-left:0}.samples-views button{min-height:42px}.samples-views button small{font-size:10px}.sidebar.collapsed{display:none}}
@media(max-width:850px){.pattern-mode .inspector.open{position:absolute;right:0;top:0;bottom:0;z-index:50;width:min(80vw,290px)}.break-mode .source-panel,.device-mode .source-panel{padding:12px}.samples-views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;gap:6px;padding:7px}.samples-views button{width:100%;min-width:0;flex-shrink:1;white-space:normal}.samples-views .inspector-toggle{margin-left:0}}
