/* Compact drum editor: fit sixteen lanes before resorting to vertical scroll. */
.pattern-mode .source-panel{padding:6px 10px}
.pattern-mode .source-wave-wrap{height:76px}
.pattern-mode .panel-head{margin-bottom:5px;gap:8px}
.pattern-mode .source-footer{margin-top:5px;gap:4px}
.pattern-mode .source-footer button{padding:4px 7px;font-size:10px}
.pattern-mode .arrange{padding:6px}
.pattern-mode .pattern-toolbar{padding:6px 9px;gap:8px;flex-wrap:wrap}
.pattern-mode .pattern-toolbar small{display:none}
.pattern-mode .pattern-actions{gap:4px;flex-shrink:1}
.pattern-mode .pattern-actions button,.pattern-mode .pattern-actions select{padding:4px 6px;font-size:10px}
.pattern-mode .pattern-footer{padding:4px 9px;font-size:9px}
.pattern-mode .clip-scroll{padding:0;--slice-row-height:26px}
.pattern-mode .clip-label,.pattern-mode .clip-lane{height:var(--slice-row-height);box-sizing:border-box}
.pattern-mode .clip-label button{padding:1px 7px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.pattern-mode .clip-label strong{font-size:10px;white-space:nowrap}
.pattern-mode .clip-label small{font-size:8px}
.pattern-mode .clip-event{top:2px;height:calc(var(--slice-row-height) - 4px);font-size:10px;border-radius:2px}
.pattern-mode .clip-resize{top:1px;bottom:1px}

.app button:not(:disabled){transition:background-color .14s ease,border-color .14s ease}
.app .primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink,var(--text))}

/* Chopper bench tokens: approved specialist design, native offline type fallback. */
.ch-workspace {
  --ch-canvas: #0d151e;
  --ch-panel: #111d27;
  --ch-a: #63d4df;
  --ch-b: #ffad66;
  --ch-play-color: var(--ch-a);
  --ch-surface: #1b2c39;
  --ch-line: #2b3e4c;
  --ch-ink: #f2f5fa;
  --ch-focus: #c4b2ff;
  --ch-pending: #f0aa53;
  --ch-muted: #b5c6d3;
  --ch-play-ink: #0d151e;
  --ch-event-bg: #2b3e4c;
  --ch-grid-bg: #152530;
  --ch-grid-major: #52657488;
  --ch-grid-minor: #2b3e4c88;
  --ch-grid-division: #2b3e4c55;
  --ch-cue-border: #2b3e4c80;
  --ch-focus-fill: #c4b2ff22;
  --ch-sounding-fill: #f2f5fa30;
  --ch-active-fill: #14212b88;
  --ch-active-ink: #f2f5fa;
  --ch-active-border: #f2f5fa;
  --ch-playhead: #fff;
  --ch-sequence-playing: color-mix(in srgb, #278394 28%, var(--ch-surface));
  --ch-sequence-live: #63d4df;
  --ch-sequence-live-ink: #bdf5fb;
  --ch-sequence-kind-bg: #394252;
  --ch-kind-base: #b5d9c2;
  --ch-kind-variation: #d3bcff;
  --ch-error: #ffb6a8;
  --ch-matrix-overlay: #10202b;
  --ch-matrix-active-fill: #65758166;
  --ch-matrix-event-base: #172833;
  --ch-matrix-ghost-base: #20303c;
  --ch-marker-label-bg: #10202b;
  --ch-cue-layer-bg: #16323c;
  --ch-marker-kick: #ef7979;
  --ch-marker-snare: #e8b16d;
  --ch-marker-hat: #76c9ad;
  --ch-marker-other: #b6a0ea;
  --ch-layer-kick: #f8a0a0;
  --ch-layer-snare: #d7c1ff;
  --ch-layer-hat: #b9df99;
  --ch-layer-selected-border: #566f7f;
  --ch-legacy-wave: #b7c9d3;
  display: grid;
  grid-template-columns: 232px minmax(0, 1fr) 250px;
  grid-template-rows: auto 1fr auto;
  min-height: 100dvh;
  background: var(--ch-canvas);
  color: var(--ch-ink);
  font:
    14px/1.45 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color-scheme: dark;
}
.ch-workspace[hidden] {
  display: none;
}
.ch-workspace * {
  box-sizing: border-box;
}
.ch-workspace h1,
.ch-workspace h2,
.ch-workspace p {
  margin: 0;
}
.ch-workspace h1 {
  font-size: 22px;
  font-weight: 650;
  line-height: 1.15;
}
.ch-workspace h1 small {
  display: block;
  font-size: 11px;
  color: var(--ch-muted);
  font-weight: 400;
}
.ch-workspace h2 {
  font-size: 16px;
  font-weight: 600;
}
.ch-workspace button,
.ch-workspace input,
.ch-workspace select,
.ch-return {
  font: inherit;
  border: 1px solid var(--ch-line, #2b3e4c);
  border-radius: 4px;
  background: var(--ch-surface, #1b2c39);
  color: var(--ch-ink, #f2f5fa);
  min-height: 36px;
  padding: 6px 10px;
}
.ch-workspace button {
  cursor: pointer;
}
.ch-workspace button:disabled {
  opacity: 1;
  cursor: not-allowed;
}
.ch-workspace button[aria-pressed="true"],
.ch-workspace button.selected {
  border-color: var(--ch-focus);
  box-shadow: inset 0 0 0 1px var(--ch-focus);
}
.ch-workspace :focus-visible {
  outline: 2px solid var(--ch-focus);
  outline-offset: 3px;
}
/* Ordinary controls skip the double-tap-zoom delay; gesture surfaces below
   override this with their own pan-x/pan-y or none. */
.ch-workspace :where(button, select, summary, [role="tab"]) {
  touch-action: manipulation;
}
.ch-workspace input[type="number"] {
  width: 82px;
  font-variant-numeric: tabular-nums;
}
.ch-workspace input[type="range"] {
  width: 88px;
  accent-color: var(--ch-focus);
  padding: 0;
}
.ch-workspace input[type="checkbox"] {
  width: 18px;
  min-height: 18px;
  accent-color: var(--ch-focus);
}
.ch-workspace label {
  display: flex;
  align-items: center;
  gap: 8px;
}
.ch-transport {
  grid-column: 1/-1;
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 14px 20px;
  border-bottom: 1px solid var(--ch-line);
  position: sticky;
  top: 0;
  background: var(--ch-canvas);
  z-index: 70; /* above the Seed drawer (60) so the Project dropdown is never hidden */
}
.ch-transport h1 {
  margin-right: auto;
}
.ch-transport .ch-play {
  background: var(--ch-play-color);
  color: var(--ch-play-ink);
  min-width: 72px;
  font-weight: 650;
}
.ch-library {
  grid-column: 1;
  grid-row: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  border-right: 1px solid var(--ch-line);
}
.ch-library > * {
  flex-shrink: 0;
}
.ch-library h2:not(:first-child) {
  margin-top: 20px;
}
.ch-library button {
  text-align: left;
  overflow-wrap: anywhere;
}
.ch-library small {
  display: block;
  color: var(--ch-muted);
}

/* Embedded Chopper consumes the Studio palette; no attributes means standalone dark fallback. */
:root[data-theme] .ch-workspace {
  --ch-canvas: var(--bg, #0d151e);

  --ch-line: var(--line, #2b3e4c);
  --ch-ink: var(--text, #f2f5fa);
  --ch-muted: var(--muted, #b5c6d3);
  --ch-focus: var(--accent-safe, var(--accent, #c4b2ff));
  --ch-event-bg: var(--ch-surface);
  --ch-grid-bg: color-mix(in srgb, var(--ch-canvas) 88%, var(--ch-surface));
  --ch-grid-major: color-mix(in srgb, var(--ch-ink) 35%, var(--ch-line));
  --ch-grid-minor: color-mix(in srgb, var(--ch-ink) 16%, var(--ch-line));
  --ch-grid-division: color-mix(in srgb, var(--ch-ink) 24%, var(--ch-line));
  --ch-cue-border: color-mix(in srgb, var(--ch-ink) 16%, var(--ch-line));
  --ch-focus-fill: color-mix(in srgb, var(--ch-focus) 18%, transparent);
  --ch-sounding-fill: color-mix(in srgb, var(--ch-ink) 14%, transparent);
  --ch-active-fill: color-mix(in srgb, var(--ch-ink) 16%, transparent);
  --ch-active-ink: var(--ch-ink);
  --ch-active-border: var(--ch-line);
  --ch-playhead: var(--ch-focus);
  --ch-sequence-playing: color-mix(in srgb, var(--ch-a) 18%, var(--ch-surface));
  --ch-sequence-live: var(--ch-a);
  --ch-sequence-live-ink: var(--ch-a);
  --ch-sequence-kind-bg: var(--ch-surface);
  --ch-matrix-overlay: var(--ch-surface);
  --ch-matrix-active-fill: color-mix(in srgb, var(--ch-ink) 16%, transparent);
  --ch-matrix-event-base: var(--ch-surface);
  --ch-matrix-ghost-base: var(--ch-surface);
  --ch-marker-label-bg: var(--ch-surface);
  --ch-cue-layer-bg: color-mix(in srgb, var(--ch-a) 14%, var(--ch-surface));
  --ch-layer-selected-border: var(--ch-line);
  --ch-legacy-wave: var(--ch-muted);
  --ch-play-ink: #0d151e;
  color-scheme: dark;
  font-family: var(--studio-font, inherit);
}
:root[data-theme="light"] .ch-workspace {
  --ch-grid-major: color-mix(in srgb, var(--ch-ink) 46%, var(--ch-line));
  --ch-grid-minor: color-mix(in srgb, var(--ch-ink) 24%, var(--ch-line));
  --ch-grid-division: color-mix(in srgb, var(--ch-ink) 33%, var(--ch-line));
  --ch-cue-border: color-mix(in srgb, var(--ch-ink) 25%, var(--ch-line));
  --ch-a: #006975;
  --ch-b: #955100;
  --ch-play-ink: #fff;
  --ch-pending: #874900;
  --ch-sequence-live-ink: var(--ch-a);
  --ch-kind-base: #24613f;
  --ch-kind-variation: #604494;
  --ch-error: #a61d17;
  --ch-marker-kick: #a62a25;
  --ch-marker-snare: #874900;
  --ch-marker-hat: #216f4b;
  --ch-marker-other: #604494;

  .ch-workspace .ch-transport .ch-bpm { grid-area: bpm; }
  .ch-workspace .ch-transport .ch-undo { grid-area: undo; }
  .ch-workspace .ch-transport .ch-more { grid-area: more; }
  .ch-workspace .ch-transport .ch-mobile-listen { grid-area: listen; display: flex; }
  .ch-workspace .ch-transport .ch-project-copy { grid-area: proj; max-width: 130px; }
  .ch-workspace .ch-transport .ch-project-status { grid-area: status; height: 34px; }
  .ch-workspace .ch-transport .ch-device-dot,
  .ch-workspace .ch-transport .ch-desktop-listen { display: none; }
  .ch-workspace .ch-transport:not(.more-open) .ch-library-toggle,
  .ch-workspace .ch-transport:not(.more-open) .ch-project-menu { display: none; }
  .ch-workspace .ch-transport.more-open .ch-restart { grid-area: restart; display: block; }
  .ch-workspace .ch-transport.more-open .ch-redo { grid-area: redo; display: block; }
  .ch-workspace .ch-transport.more-open label.ch-secondary:has(input[aria-label="Preview level"]) { grid-area: preview; display: flex; }
  .ch-workspace .ch-transport.more-open .ch-inspector-toggle { grid-area: inspector; display: block; }
  .ch-workspace .ch-transport.more-open .ch-library-toggle { grid-area: library; display: block; }
  .ch-workspace .ch-transport.more-open .ch-project-menu { grid-area: menu; display: block; }
}

/* Calm Cue Desk: unified lane addressing (cue number + source bar.beat) and
   alternating source-bar banding so bars are countable at a glance. */
.ch-lane-pos {
  color: var(--ch-muted);
  font-size: 9px;
  font-variant-numeric: tabular-nums;
}
.ch-matrix-row.bar-alt {
  background: color-mix(in srgb, var(--ch-ink) 3%, transparent);
}

/* Calm Cue Desk: device status card — one primary action, guidance, folded extras. */
.ch-device-card-head {
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  margin-bottom: 8px;
}
.ch-device-card-head strong {
  color: var(--ch-muted); font-size: 10px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
}
.ch-device-state { color: var(--ch-muted); font-size: 10px; }
.ch-workspace .ch-device-primary {
  border-color: color-mix(in srgb, var(--ch-a) 55%, var(--ch-line));
  color: var(--ch-a);
  background: color-mix(in srgb, var(--ch-a) 10%, var(--ch-surface));
  font-weight: 650;
}
.ch-device-more { margin-top: 10px; }
.ch-device-more > summary { cursor: pointer; color: var(--ch-muted); font-size: 11px; overflow-wrap: anywhere; }
.ch-device-more > :not(summary) {
  display: block; width: 100%; min-width: 0;
  white-space: normal; overflow-wrap: anywhere;
}
.ch-device-more > button { margin-top: 6px; text-align: left; line-height: 1.25; }

/* The fixed mobile view tab bar must never cover the last library controls. */
@media (max-width: 1199px) {
  .ch-workspace.library-open .ch-library { padding-bottom: 66px; }
}

/* Calm Cue Desk: the Seed plan is visible while collapsed — a 16-slot role-colored strip. */
.ch-seed-summary > summary { flex-wrap: wrap; }
.ch-seed-copy { flex: 0 1 auto; min-width: 0; }
.ch-seed-strip {
  flex: 1 1 240px;
  min-width: 0;
  display: grid;
  grid-template-columns: repeat(16, minmax(0, 1fr));
  gap: 2px;
}
.ch-seed-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  padding: 2px 0;
  border: 1px solid transparent;
  border-radius: 4px;
  background: var(--ch-sequence-kind-bg);
}
.ch-seed-slot b {
  color: var(--ch-ink);
  font-size: 8px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.ch-seed-slot small { color: var(--ch-muted); font-size: 7px; }
.ch-seed-slot.kind-fill { background: color-mix(in srgb, var(--ch-role-fill) 26%, var(--ch-surface)); }
.ch-seed-slot.kind-base { background: color-mix(in srgb, var(--ch-role-base) 26%, var(--ch-surface)); }
.ch-seed-slot.kind-variation { background: color-mix(in srgb, var(--ch-role-variation) 26%, var(--ch-surface)); }

.ch-seed-slot.live {
  border-color: var(--ch-sequence-live);
  box-shadow: 0 0 0 1px var(--ch-sequence-live);
}
.ch-seed-counts { flex: 0 0 auto; color: var(--ch-muted); font-size: 10px; white-space: nowrap; }
.ch-seed-counts b { color: var(--ch-ink); }
.ch-workspace .ch-seed-random { min-width: 44px; min-height: 44px; font-size: 16px; }
.ch-sequence-controls .ch-sequence-probability .ch-seed-gates {
  grid-column: 1;
  grid-row: 2;
  position: relative;
  height: 0;
  pointer-events: none;
}
.ch-seed-gates i {
  position: absolute;
  top: -7px;
  width: 1px;
  height: 14px;
  background: color-mix(in srgb, var(--ch-ink) 45%, transparent);
}
.ch-seed-table { margin-top: 10px; }
.ch-seed-table > summary {
  cursor: pointer;
  color: var(--ch-muted);
  font-size: 11px;
  padding: 6px 0;
}

/* Calm Cue Desk: rounded corners follow the owner's Studio appearance setting.
   Higher-specificity rules (matrix events, play button) keep their tuned radii. */
.ch-workspace button,
.ch-workspace input,
.ch-workspace select,
.ch-workspace summary {
  border-radius: var(--studio-radius, 8px);
}
.ch-workspace .ch-project-status { border-radius: 999px; }
.ch-workspace .ch-source-panel,
.ch-workspace .ch-pattern-panel { border-radius: 10px; }

/* Compact layout T1: one-row command bar; caption on one line. */
.ch-workspace .ch-transport.ch-project-strip { flex-wrap: nowrap; min-height: 52px; max-height: 56px; overflow: hidden; }
.ch-workspace .ch-project-copy small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Compact layout T4: one role palette shared by pattern tabs and the Seed ribbon. */
.ch-workspace {
  --ch-role-base: var(--ch-kind-base);
  --ch-role-variation: var(--ch-kind-variation);
  --ch-role-fill: var(--ch-b);
}
.ch-workspace .ch-pattern-name[data-role="base"] { --tab-role: var(--ch-role-base); }
.ch-workspace .ch-pattern-name[data-role="variation"] { --tab-role: var(--ch-role-variation); }
.ch-workspace .ch-pattern-name[data-role="fill"] { --tab-role: var(--ch-role-fill); }
.ch-workspace .ch-pattern-name[data-role] {
  color: var(--tab-role);
  border-color: color-mix(in srgb, var(--tab-role) 45%, var(--ch-line));
}
.ch-workspace .ch-pattern-name[data-role][aria-pressed="true"],
.ch-workspace .ch-pattern-name[data-role][aria-current="true"] {
  background: color-mix(in srgb, var(--tab-role) 20%, var(--ch-surface));
  border-color: var(--tab-role);
  color: var(--ch-ink);
}


/* Compact layout T5: Seed collapsed = one strip button; plan in a drawer over the matrix. */
.ch-workspace .ch-seed-toggle {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 56px;
  padding: 8px 12px; text-align: left; border: 1px solid var(--ch-line); border-radius: var(--studio-radius, 10px);
  background: var(--ch-panel); color: var(--ch-ink); cursor: pointer;
}
.ch-workspace .ch-seed-toggle[aria-expanded="true"] { border-color: var(--ch-focus); }
.ch-workspace .ch-seed-toggle .ch-seed-copy strong { display: block; font-size: 12px; }
.ch-workspace .ch-seed-toggle .ch-seed-copy small { display: block; color: var(--ch-muted); font-size: 10px; white-space: nowrap; }
.ch-workspace .ch-seed-toggle .ch-seed-strip { flex: 1 1 240px; }
.ch-workspace .ch-seed-open-action { white-space: nowrap; font-size: 11px; color: var(--ch-ink); }
.ch-seed-drawer {
  position: fixed; top: var(--ch-seed-drawer-top, 0px); right: 0; bottom: var(--ch-seed-drawer-bottom, 0px); z-index: 60;
  width: min(780px, 100vw); overflow: auto; padding: 14px 16px 20px;
  background: var(--ch-panel); border-left: 1px solid var(--ch-line);
  box-shadow: -12px 0 32px rgba(0,0,0,.25);
}
.ch-seed-drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.ch-seed-drawer-head strong { font-size: 13px; }
.ch-seed-drawer-head button { min-height: 32px; }
@media (max-width: 767px) {
  .ch-seed-drawer {
    top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 82vh;
    border-left: 0; border-top: 1px solid var(--ch-line); border-radius: 14px 14px 0 0;
  }
}

/* Compact layout T7: telemetry in a Diagnostics disclosure, not the footer line. */
.ch-diagnostics { position: relative; margin-left: auto; }
.ch-diagnostics > summary { cursor: pointer; color: var(--ch-muted); font-size: 11px; list-style: none; }
.ch-diagnostics[open] { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.ch-diagnostics[open] > summary { width: 100%; }

/* Compact layout T8: the device head stays one flex row (the generic
   .ch-device-actions > :not(summary) rule would otherwise make it a block and
   glue “Device” to its state), and disabled primary looks disabled, not like an input. */
.ch-device-actions > .ch-device-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; width: 100%; }
.ch-workspace .ch-device-primary:disabled {
  background: var(--ch-surface); border-style: dashed; color: var(--ch-muted); opacity: .8;
}

/* Compact layout: on phones Undo/Redo collapse to 44px icon buttons so the
   pattern toolbar stays one row at 390px and at most two at 320px. */
@media (max-width: 767px) {
  .ch-workspace .ch-undo-matrix, .ch-workspace .ch-redo-matrix {
    font-size: 0; min-width: 44px; width: 44px; padding: 0;
  }
  .ch-workspace .ch-undo-matrix::before { content: "↶"; font-size: 18px; }
  .ch-workspace .ch-redo-matrix::before { content: "↷"; font-size: 18px; }
}

/* Visual pass: the 6-column prediction table is wider than a phone, so it needs
   its own horizontal scroller instead of running under the screen edge. */
.ch-seed-table { overflow-x: auto; max-width: 100%; }
.ch-seed-table table { min-width: 0; width: 100%; table-layout: fixed; }

/* Visual pass F5: the center column distributes its height so the matrix window
   fills the space instead of leaving a dead band under a 16-row clip. */
.ch-center { display: flex; flex-direction: column; }
.ch-center .ch-pattern-panel { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.ch-pattern-panel .ch-pattern { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.ch-pattern .ch-pattern-scroll { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.ch-pattern-scroll .ch-matrix { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; }
.ch-pattern-scroll .ch-cue-viewport {
  flex: 1 1 0; height: auto !important; min-height: calc(var(--cue-height, 17px) * 16);
}

/* Visual pass F6: disabled controls are neutral and muted, never full-brightness. */
.ch-workspace button:disabled {
  background: var(--ch-surface); border-color: var(--ch-line);
  color: var(--ch-muted); cursor: not-allowed;
}

/* The window-size caption must not change the foot height, or the flex height
   distribution oscillates (visible rows -> caption wrap -> height -> rows). */
.ch-matrix-foot { flex-wrap: nowrap; }
.ch-matrix-foot > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Visual pass F7: on phones the collapsed Seed strip wraps — copy shrinks with an
   ellipsis and the 16-slot ribbon gets its own row instead of overlapping texts. */
@media (max-width: 767px) {
  .ch-workspace .ch-seed-toggle { flex-wrap: wrap; row-gap: 6px; column-gap: 6px; }
  .ch-workspace .ch-seed-toggle .ch-seed-copy { flex: 1 1 70px; min-width: 0; }
  .ch-workspace .ch-seed-toggle .ch-seed-copy small { overflow: hidden; text-overflow: ellipsis; }
  .ch-workspace .ch-seed-toggle .ch-seed-copy strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ch-workspace .ch-seed-toggle .ch-seed-counts { flex: 0 0 auto; }
  .ch-workspace .ch-seed-toggle .ch-seed-open-action { flex: 0 0 auto; }
  .ch-workspace .ch-seed-toggle .ch-seed-strip { flex: 1 1 100%; order: 5; min-width: 0; }
  .ch-workspace .ch-seed-toggle .ch-seed-slot { min-width: 0; }
  .ch-workspace .ch-seed-toggle .ch-seed-slot small { display: none; }
  .ch-workspace .ch-seed-toggle[aria-expanded="true"] .ch-seed-counts { display: none; }
}

/* Visual pass F8: segmented tools keep a visible gap so labels never touch. */
.ch-tool-toggle { gap: 2px; }
.ch-tool-toggle button { border-radius: 6px; }

/* Owner: +VAR / +FILL read as their roles, not as generic secondary buttons. */
.ch-pattern-focus > button[aria-label="New variation"]:not(:disabled) {
  color: var(--ch-role-variation);
  border-color: color-mix(in srgb, var(--ch-role-variation) 55%, var(--ch-line));
  background: color-mix(in srgb, var(--ch-role-variation) 12%, var(--ch-surface));
}
.ch-pattern-focus > button[aria-label="New FILL"]:not(:disabled) {
  color: var(--ch-role-fill);
  border-color: color-mix(in srgb, var(--ch-role-fill) 55%, var(--ch-line));
  background: color-mix(in srgb, var(--ch-role-fill) 12%, var(--ch-surface));
}
/* The Inspector toggle lives in the More drawer on phones. */
@media (max-width: 767px) {
  .ch-workspace .ch-transport:not(.more-open) .ch-inspector-toggle { display: none; }
}

/* Seed plan redesign (frontend-design pass): one dense column — head with counts,
   two control rows, the prediction table owns the remaining height, caveat at foot. */
.ch-seed-drawer { display: flex; flex-direction: column; padding: 10px 14px 12px; }
.ch-seed-drawer-head { flex: 0 0 auto; margin-bottom: 8px; gap: 10px; }
.ch-seed-drawer-head strong { font-size: 13px; }
.ch-seed-drawer-head .ch-seed-counts { margin-left: auto; color: var(--ch-muted); font-size: 11px; }
.ch-seed-drawer-head .ch-seed-counts b { color: var(--ch-ink); }
.ch-seed-drawer-head button { min-height: 32px; padding-inline: 10px; }
.ch-seed-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.ch-seed-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ch-seed-row-main > label:first-child { flex: 0 1 170px; min-width: 0; }
.ch-seed-row-main input[type="number"] { width: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.ch-seed-row-main .ch-seed-random { flex: 0 0 auto; min-width: 36px; }
.ch-seed-gate { flex: 1 1 180px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.ch-seed-gate > span { font-size: 11px; color: var(--ch-muted); }
.ch-seed-gate input[type="range"] { flex: 1 1 auto; min-width: 60px; }
.ch-seed-gate output { font-size: 11px; font-variant-numeric: tabular-nums; min-width: 34px; text-align: right; }
.ch-seed-row-actions > button { flex: 0 0 auto; }
.ch-seed-row-actions > label { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ch-muted); }
.ch-seed-row-actions > label:first-of-type { flex: 0 1 110px; min-width: 0; }
.ch-seed-table { flex: 1 1 auto; min-height: 140px; margin-top: 0; display: flex; flex-direction: column; overflow: hidden; }
.ch-seed-table .ch-sequence-preview { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; overflow: hidden; }
.ch-seed-table .ch-sequence-rules { display: flex; flex-wrap: wrap; gap: 4px; }
.ch-seed-table .ch-sequence-rules > * { font-size: 10px; padding: 2px 6px; }
.ch-seed-table .ch-sequence-summary { font-size: 11px; }
.ch-seed-table .ch-sequence-table-wrap { flex: 1 1 auto; min-height: 0; overflow: auto; }
.ch-seed-footnote { flex: 0 0 auto; margin: 0; font-size: 10px; color: var(--ch-muted); }
@media (max-width: 767px) {
  .ch-seed-row-main > label:first-child { flex: 1 1 130px; }
  .ch-seed-gate { flex: 1 1 100%; order: 3; }
}

/* Owner: on desktop the whole command bar moves into the waveform panel head,
   so the page loses one horizontal band. Phones/tablets keep the sticky bar. */
.ch-wave-transport .ch-operation-feedback {
  flex: 1 1 200px;
  min-width: 0;
  font-size: 11px;
  color: var(--ch-muted);
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ch-wave-transport .ch-operation-feedback.error { color: var(--ch-danger); }
.ch-wave-transport .ch-project-copy { margin-left: auto; min-width: 0; }
.ch-wave-transport .ch-project-copy small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ch-muted);
  font-size: 11px;
}
.ch-wave-transport {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--ch-line);
  /* above the Seed drawer (60) so the Project dropdown is never hidden */
  position: relative;
  z-index: 70;
}
@media (max-width: 1199px) {
  #ch-seed-drawer.ch-seed-drawer { top: 56px; }
}

/* Desktop: no separate command bar; the cluster lives in the waveform head.
   The Library toggle is redundant there because the library column is always visible. */
.ch-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}
.ch-wave-transport .ch-library-toggle,
.ch-wave-transport .ch-more,
.ch-wave-transport .ch-mobile-listen { display: none; }
.ch-wave-transport .ch-project-copy { flex: 0 1 180px; }

/* Owner: no horizontal scroll in the Seed plan. Fixed layout lets columns share
   the drawer width; phones drop the State column (its warnings live in the summary). */
.ch-sequence-table th, .ch-sequence-table td { overflow: hidden; text-overflow: ellipsis; }
.ch-sequence-table td { white-space: normal; }
@media (max-width: 767px) {
  .ch-seed-table .ch-sequence-table { font-size: 10px; }
  .ch-seed-table .ch-sequence-table th:last-child,
  .ch-seed-table .ch-sequence-table td:last-child { display: none; }
}

/* Owner: device actions always visible, compact two-column grid; transfer notes
   sit at the very bottom of the card; the capability disclaimer line is gone. */
.ch-workspace .ch-device-actions > .ch-device-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.ch-device-grid > button { min-width: 0; width: 100%; }
.ch-device-grid > p, .ch-device-grid > label { grid-column: 1 / -1; }
.ch-device-grid > p { margin: 0; font-size: 11px; color: var(--ch-muted); }
.ch-device-actions > .ch-device-notes { margin-top: 8px; }

/* Idle status stays in the DOM (stable child order keeps the Project details
   alive across message changes) but takes no space and says nothing. */
.ch-status.idle { display: none; }

/* Frontend-design pass: in the 232px library column every action label must read
   in full — two columns with wrapping, never ellipsised verbs. */
.ch-workspace .ch-device-grid > button {
  white-space: normal;
  overflow: visible;
  text-overflow: clip;
  min-height: 40px;
  font-size: 11px;
  line-height: 1.25;
  padding: 6px 4px;
}
.ch-device-grid > .ch-device-span { grid-column: 1 / -1; }
.ch-library > .ch-device-notes { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ch-line); }

/* Balanced wrapping kills orphan words in the paired device actions. */
.ch-workspace .ch-device-grid > button { text-wrap: pretty; }

/* Bottom-of-library notes scan as three separate thoughts, not one wall. */
.ch-library > .ch-device-notes p { margin: 0 0 6px; }
.ch-library > .ch-device-notes p:last-child { margin-bottom: 0; }

/* Perform strip: live slice keys + momentary pads (CHOPPAH panel semantics).
   Collapsible, default closed; the project document is never touched. */
.ch-perform { display: grid; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--ch-line); background: var(--ch-surface); }
.ch-perform-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ch-perform-head small { color: var(--ch-muted); font-size: 11px; }
.ch-perform-snap { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ch-muted); }
.ch-perform-keys { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
.ch-perform-key { min-height: 34px; font-size: 12px; font-variant-numeric: tabular-nums; border-radius: var(--studio-radius, 8px); }
.ch-perform-key.held { background: color-mix(in srgb, var(--ch-a) 22%, var(--ch-surface)); box-shadow: inset 0 0 0 1px var(--ch-a); }
.ch-perform-pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.ch-perform-pad { min-height: 30px; font-size: 10px; letter-spacing: .04em; border-radius: var(--studio-radius, 8px); }
.ch-perform-pad.held { background: color-mix(in srgb, var(--ch-role-fill) 22%, var(--ch-surface)); box-shadow: inset 0 0 0 1px var(--ch-role-fill); }
@media (pointer: coarse) {
  .ch-perform-key { min-height: 44px; }
  .ch-perform-pad { min-height: 44px; }
}
@media (max-width: 767px) {
  .ch-perform-keys { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .ch-perform-pads { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* Loop FX panel: four slots, each with a parameter-driven live curve. */
.ch-loop-fx { border-top: 1px solid var(--ch-line); padding: 6px 10px; }
.ch-loop-fx > summary { cursor: pointer; font-size: 12px; color: var(--ch-muted); }
.ch-fx-rows { display: grid; gap: 8px; padding-top: 8px; }
.ch-fx-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 96px; gap: 8px; align-items: center; }
.ch-fx-enable { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
.ch-fx-param { display: grid; gap: 2px; font-size: 10px; color: var(--ch-muted); }
.ch-fx-mod { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding-top: 4px; margin-top: 4px; border-top: 1px dashed var(--ch-line); }
.ch-fx-mod .ch-fx-param { min-width: 0; flex: 1 1 64px; }
.ch-fx-mod select, .ch-fx-mod input[type=range] { width: 100%; min-width: 0; }
.ch-fx-mod select { min-height: 28px; background: var(--ch-surface); color: var(--ch-text); border: 1px solid var(--ch-line); border-radius: var(--studio-radius, 8px); }
@media (pointer: coarse) { .ch-fx-mod select, .ch-fx-mod input[type=checkbox] { min-height: 44px; } .ch-fx-mod input[type=range] { min-height: 44px; } }
.ch-fx-row > .ch-fx-param + .ch-fx-param { grid-column: 2; }
.ch-fx-curve { width: 96px; height: 32px; background: color-mix(in srgb, var(--ch-text) 6%, transparent); border-radius: 4px; }
.ch-fx-curve polyline { fill: none; stroke: var(--ch-a); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.ch-loop-fx > small { display: block; padding-top: 6px; color: var(--ch-muted); font-size: 10px; }
@media (max-width: 767px) {
  .ch-fx-row { grid-template-columns: 80px minmax(0, 1fr); }
  .ch-fx-curve { grid-column: 1 / -1; width: 100%; }
}

/* Swing + Tap stay inside the single-row wave command cluster. */
.ch-swing { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ch-muted); }
.ch-swing input { width: 64px; min-height: 20px; }
.ch-tap { min-height: 28px; padding: 2px 8px; font-size: 11px; }
@media (pointer: coarse) {
  .ch-tap { min-width: 44px; }
  .ch-swing input { min-height: 44px; width: 88px; }
}

/* Seed chips name their role and per-role number, so Base/Var/Fill are obvious. */
.ch-seed-role { font-style: normal; font-size: 8px; line-height: 1.1; color: var(--ch-sequence-kind-ink, var(--ch-muted)); white-space: nowrap; }

/* Parity A2: live gate, readouts and per-voice tuning in the perform panel. */
.ch-perform-live { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 6px 4px; }
.ch-perform-live input[type="range"] { width: 110px; accent-color: var(--ch-accent, #6ea8fe); }
.ch-perform-readout { font-variant-numeric: tabular-nums; color: var(--ch-muted, #9aa4b2); font-size: 12px; }
.ch-perform-tune { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px 12px; padding: 8px 4px; border-top: 1px solid var(--ch-line, #2a3140); }
.ch-perform-tune label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ch-muted, #9aa4b2); }
.ch-perform-tune input[type="range"] { width: 100%; accent-color: var(--ch-accent, #6ea8fe); }
.ch-perform-tune select { min-height: 32px; }
@media (pointer: coarse) { .ch-perform-tune select, .ch-perform-live input[type="range"] { min-height: 44px; } }

/* A3: ARP black-key strip and generator character. */
.ch-arp { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 4px; border-top: 1px solid var(--ch-line, #2a3140); }
.ch-arp-key { min-height: 36px; padding: 4px 10px; border-radius: var(--studio-radius, 8px); background: var(--ch-key-black, #1c2130); color: var(--ch-text, #e8ecf4); border: 1px solid var(--ch-line, #2a3140); font-size: 11px; letter-spacing: 0.04em; }
.ch-arp-key.held { background: var(--ch-accent, #6ea8fe); color: #0b1020; }
.ch-arp-key.latched { border-color: var(--ch-accent, #6ea8fe); box-shadow: inset 0 0 0 1px var(--ch-accent, #6ea8fe); }
.ch-seed-character { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; padding: 8px 4px; align-items: end; }
.ch-seed-character button { grid-column: 1 / -1; }
.ch-seed-character label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ch-muted, #9aa4b2); }
.ch-seed-character input[type="range"] { width: 100%; accent-color: var(--ch-accent, #6ea8fe); }
.ch-slice-fx { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 12px; }
.ch-slice-fx label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; min-width: 0; }
.ch-slice-fx input[type="range"], .ch-slice-fx select { width: 100%; min-width: 0; }
@media (pointer: coarse) { .ch-arp-key { min-height: 44px; } }
@media (max-width: 640px) { .ch-seed-character, .ch-slice-fx { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
