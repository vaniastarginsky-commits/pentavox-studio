<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pentavox Studio — connection check</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, Avenir Next, Avenir, Helvetica Neue, sans-serif;
      background: #17191c;
      color: #ecebe6;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        linear-gradient(90deg, transparent 49.8%, #24272b 50%, transparent 50.2%),
        #17191c;
    }
    main {
      width: min(720px, 100%);
      border: 1px solid #555961;
      border-radius: 5px;
      background: #22252a;
      box-shadow: 0 18px 55px #08090a99;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px;
      border-bottom: 1px solid #555961;
      background: #d8d6cf;
      color: #17191c;
    }
    .lamp {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      border: 2px solid #62625e;
      border-radius: 50%;
      background: #777872;
      box-shadow: inset 0 0 0 3px #c7c5be;
    }
    main[data-state="working"] .lamp { background: #f1a23c; box-shadow: 0 0 16px #f1a23c99; }
    main[data-state="ready"] .lamp { background: #55bfd1; box-shadow: 0 0 16px #55bfd199; }
    main[data-state="error"] .lamp { background: #d75b57; box-shadow: 0 0 16px #d75b5799; }
    h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2rem); font-weight: 650; letter-spacing: -.025em; }
    .subtitle { margin: 3px 0 0; color: #565956; font-size: .94rem; }
    section { padding: 24px; }
    button {
      appearance: none;
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid #d48a2d;
      border-radius: 3px;
      background: #f1a23c;
      color: #191b1e;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #ffb24c; }
    button:focus-visible { outline: 3px solid #55bfd1; outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .55; }
    #status { margin: 18px 0 0; line-height: 1.5; color: #c9cac7; }
    #status.error { color: #ff9690; }
    dl {
      display: grid;
      grid-template-columns: minmax(130px, 1fr) 2fr;
      margin: 24px 0 0;
      border-top: 1px solid #44484e;
    }
    dt, dd { margin: 0; padding: 10px 0; border-bottom: 1px solid #383c41; }
    dt { color: #a3a6a4; }
    dd { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #f4f2eb; overflow-wrap: anywhere; }
    .hint { margin: 20px 0 0; max-width: 62ch; color: #969a99; font-size: .9rem; line-height: 1.55; }
    @media (max-width: 520px) {
      body { padding: 12px; }
      header, section { padding: 18px; }
      dl { grid-template-columns: 1fr; }
      dt { padding-bottom: 2px; border-bottom: 0; }
      dd { padding-top: 2px; }
    }
  </style>
</head>
<body>
  <main id="panel" data-state="idle">
    <header>
      <span class="lamp" aria-hidden="true"></span>
      <div>
        <h1>Pentavox Studio</h1>
        <p class="subtitle">HostLink connection check</p>
      </div>
    </header>
    <section>
      <button id="connect" type="button">Connect</button>
      <p id="status" role="status">Connect the module over USB and close the official programmer.</p>
      <dl id="details" hidden></dl>
      <p class="hint">This page only reads HELLO, the descriptor and the live state. It does not change any module settings.</p>
    </section>
  </main>

  <script type="module">
    import { HostLinkClient } from './hostlink/client.js';
    import { WebSerialTransport } from './hostlink/transport_webserial.js';

    const panel = document.querySelector('#panel');
    const button = document.querySelector('#connect');
    const status = document.querySelector('#status');
    const details = document.querySelector('#details');
    let client = null;

    function countDestinationFields(descriptor) {
      return (descriptor.components ?? []).reduce(
        (count, component) => count + (component.fields ?? []).filter((field) => field.id?.endsWith('.dest')).length,
        0,
      );
    }

    function showDetails(rows) {
      details.replaceChildren();
      for (const [label, value] of rows) {
        const term = document.createElement('dt');
        const description = document.createElement('dd');
        term.textContent = label;
        description.textContent = value;
        details.append(term, description);
      }
      details.hidden = false;
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      details.hidden = true;
      status.className = '';
      status.textContent = 'Choose the module serial port…';
      panel.dataset.state = 'working';
      try {
        if (client) await client.close();
        const transport = await WebSerialTransport.connect();
        client = new HostLinkClient(transport);
        status.textContent = 'Reading firmware and route information…';
        const info = await client.hello();
        const descriptor = await client.getDescriptor(info);
        await client.getLive(info);
        const destinationFields = countDestinationFields(descriptor);
        showDetails([
          ['Module', `${info.moduleName} (${info.moduleId})`],
          ['Firmware', `${info.fwVersion} · ${info.fwGit}`],
          ['Board', `v${info.board}`],
          ['Descriptor', `${info.descriptorLen} bytes · CRC checked`],
          ['Route fields', String(destinationFields)],
          ['Live state', `${info.liveSize} bytes`],
          ['Schema', `0x${info.schemaHash.toString(16).padStart(8, '0')}`],
        ]);
        status.textContent = destinationFields >= 2
          ? 'Connection ready. HostLink is responding correctly.'
          : 'Connected, but the descriptor has fewer than two route fields.';
        panel.dataset.state = destinationFields >= 2 ? 'ready' : 'error';
      } catch (error) {
        status.className = 'error';
        status.textContent = error.code === 'BUSY_PORT'
          ? 'Port busy. Close the official programmer and other tabs, then try again.'
          : `Connection failed: ${error.message}`;
        panel.dataset.state = 'error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
